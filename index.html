<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7deea">
<title>Você tem novas mensagens ♡</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
:root{--ink:#6b5364;--line:#8b6f81;--pink:#f6c7db;--soft:#ffe4ee;--paper:#fffaf9;--blue:#d9e9f0}
*{box-sizing:border-box}html,body{width:100%;min-height:100%;margin:0}body{font-family:Verdana,Geneva,sans-serif;color:var(--ink);background:#fef8fa;overflow:hidden}
.desktop{position:fixed;inset:0;overflow:hidden;background:radial-gradient(circle at 18% 18%,#fff 0,#fff5f8 40%,#f7dce7 100%)}
.desktop:before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.24;background-image:radial-gradient(#e8a8c6 1px,transparent 1px);background-size:23px 23px}
.header{position:absolute;top:18px;left:18px;right:18px;display:flex;justify-content:space-between;gap:10px;z-index:5000;pointer-events:none}
.brand,.counter{border:1.5px solid var(--line);box-shadow:3px 3px 0 #d5a6bc;background:#fffafde8;padding:9px 12px;font-size:11px;letter-spacing:.09em;font-weight:700}
.counter{min-width:102px;text-align:center}.brand span{color:#bf7296}
.center-message{position:absolute;inset:0;display:grid;place-content:center;text-align:center;padding:25px;pointer-events:none}.center-message .big{font-size:clamp(27px,5vw,55px);font-weight:900;letter-spacing:-.05em;color:#bc779b}.center-message p{font-size:13px;line-height:1.8}
.window{position:absolute;left:0;top:0;width:min(390px,calc(100vw - 28px));background:var(--paper);border:2px solid var(--line);box-shadow:5px 5px 0 #ba87a2,9px 9px 0 #f5c7d9;opacity:0;transform:translateY(-25px) scale(.89) rotate(var(--tilt,0deg));transition:opacity .14s,transform .19s;display:flex;flex-direction:column;max-height:min(70vh,470px);touch-action:pan-y}
.window.final-window{--tilt:0deg!important}.window.show{opacity:1;transform:translateY(0) scale(1) rotate(var(--tilt,0deg))}.window.closing{opacity:0;transform:translateY(22px) scale(.85) rotate(5deg);pointer-events:none}
.titlebar{height:35px;flex-shrink:0;background:var(--pink);border-bottom:2px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 7px 0 11px;cursor:grab;user-select:none;touch-action:none}.titlebar:active{cursor:grabbing}.window:nth-of-type(3n) .titlebar{background:var(--blue)}.window:nth-of-type(5n) .titlebar{background:#edd7ef}
.win-title{font-size:10px;letter-spacing:.06em;font-weight:900;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.controls{display:flex;gap:5px;align-items:center}.control{border:1.5px solid var(--line);background:#fff9fb;min-width:23px;height:22px;font-size:13px;color:var(--ink);font-weight:bold;line-height:17px;cursor:pointer}.control:hover,.action:hover{background:#fff}.control:focus-visible,.action:focus-visible,.replay:focus-visible{outline:3px solid #bd73a0;outline-offset:2px}
.win-body{overflow:auto;min-height:0;padding:20px 17px 18px;text-align:center}.symbol{font-size:27px;color:#bf77a0;margin:0 0 9px}.message{font-size:13px;line-height:1.65;overflow-wrap:anywhere;margin:0 auto 17px;white-space:pre-wrap}.action{border:2px solid var(--line);background:var(--soft);padding:8px 25px;min-width:96px;color:var(--ink);font:700 12px Verdana,sans-serif;letter-spacing:.07em;cursor:pointer;box-shadow:2px 2px 0 #dbb5c8}.win-image{display:block;max-width:100%;width:100%;max-height:165px;object-fit:contain;margin:0 auto 12px;border:0;background:transparent}.play-midia{display:inline-block;border:2px solid var(--line);background:#f6c7db;color:var(--ink);font:700 16px Verdana,sans-serif;padding:16px 21px;cursor:pointer;box-shadow:3px 3px 0 #d5a6bc;margin-bottom:15px}.media-status{font-size:11px;line-height:1.5;margin:0 0 12px}.image-note{font-size:10px;color:#a17d93;margin:-4px 0 14px}
.toast{position:absolute;z-index:6000;bottom:18px;left:50%;transform:translateX(-50%);background:#fffafdee;border:1.5px solid var(--line);padding:10px 14px;font-size:11px;text-align:center;box-shadow:3px 3px 0 #d5a6bc;transition:opacity .3s;max-width:calc(100vw - 25px)}.hidden{opacity:0;pointer-events:none}.replay{pointer-events:auto;justify-self:center;margin-top:14px;background:#f6c7db;color:var(--ink);border:2px solid var(--line);padding:12px 18px;font-weight:bold;cursor:pointer;box-shadow:3px 3px 0 #d5a6bc}.replay[hidden]{display:none}
@media(max-width:600px){.header{top:9px;left:9px;right:9px}.brand,.counter{font-size:9px;padding:8px}.window{width:min(320px,calc(100vw - 26px));max-height:58vh}.win-body{padding:15px 12px}.message{font-size:12px}.win-image{max-height:135px}.toast{font-size:10px;bottom:8px}.center-message .big{font-size:29px}}
@media(prefers-reduced-motion:reduce){.window{transition:none}.toast{transition:none}}
</style>
</head>
<body>
<main class="desktop" id="desktop">
  <div class="header"><div class="brand"><span>pink</span> mail.exe</div><div class="counter" id="counter">0 NOTIFICAÇÕES</div></div>
  <section class="center-message" aria-live="polite"><div class="big" id="finalTitle">NOVAS MENSAGENS ♡</div><p id="finalDescription">Aguarde… carregando mensagens.</p><button class="replay" id="replay" hidden>↻ VER TUDO DE NOVO</button></section>
  <div class="toast" id="toast">♡ Sua caixa de entrada está prestes a ficar um pouquinho caótica…</div>
</main>
<script>
/* =============================================================
   MENSAGENS: DA MAIS FUNDA À MAIS SOBREPOSTA.
   A mensagem #10 fica no fundo. A #1 é a mais superficial.
   Imagens: ponha seus arquivos em imagens/ no GitHub.
   Mídia: coloque seu MP3 em midia/musica.mp3.
   ============================================================= */
const MENSAGENS = [
  {tipo:'texto', texto:'nunca vou deixar de torcer por você!\n\n- Seu fã chinês #1', botao:'OK'}, // TEXTO 10 (mais fundo)
  {tipo:'imagem', texto:'', imagem:'imagens/foto5.jpg', botao:'OK'},
  {tipo:'texto', texto:'The Neighborhood e Charli são no mesmo dia', botao:'OK'}, // TEXTO 9
  {tipo:'texto', texto:'precisa mesmo ser um oboé? eles devem ser os maiores mercenários!', botao:'OK'}, // TEXTO 8
  {tipo:'imagem', texto:'', imagem:'imagens/foto4.jpg', botao:'OK'},
  {tipo:'midia', texto:'', arquivo:'midia/musica.mp3', botao:'OK'}, // TEXTO 7: botão play
  {tipo:'texto', texto:'vc perguntou uma vez se eu ainda ia gostar de você se fosse louca, eu falei acho que sim porque o que faz as melhores pessoas serem loucas é elas não deixarem o que as outras pessoas pensam mudarem quem elas são.', botao:'OK'}, // TEXTO 6
  {tipo:'imagem', texto:'', imagem:'imagens/foto3.jpg', botao:'OK'},
  {tipo:'texto', texto:'eu não sei se já te perguntei isso, mas vc não acha que mexilhão é alguém que se mexe muito? (e não um bicho)', botao:'OK'}, // TEXTO 5
  {tipo:'texto', texto:'o cara ainda tá discutindo zatanna comigo', botao:'OK'}, // TEXTO 4
  {tipo:'imagem', texto:'', imagem:'imagens/foto2.jpg', botao:'OK'},
  {tipo:'texto', texto:'você acha que o BTS apoia o Lule ou nem todos?', botao:'OK'}, // TEXTO 3
  {tipo:'texto', texto:'NAO CLICA !!', botao:'OK'}, // TEXTO 2
  {tipo:'imagem', texto:'', imagem:'imagens/foto1.jpg', botao:'OK'},
  {tipo:'texto', texto:'oiiii', botao:'OK'} // TEXTO 1 (mais sobreposto)
];
/* Mais opções fáceis de ajustar */
const CONFIG = {
  intervaloMs: 115,    // ritmo médio; as janelas surgem em rajadas irregulares
  atrasoInicialMs: 800,
  tituloFinal: 'INBOX VAZIA',
  textoFinal: 'Você sobreviveu a todas as notificações. Obrigado pela paciência!'
};

const desktop = document.getElementById('desktop');
const counter = document.getElementById('counter');
const toast = document.getElementById('toast');
const title = document.getElementById('finalTitle');
const description = document.getElementById('finalDescription');
const replay = document.getElementById('replay');
let windows = [], highest = 100, timers = [], running = false, disposed = false;
const rand = (a,b)=>Math.random()*(b-a)+a;
const escapeHtml = s => String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function placeholder(index){
  const drawings = [
    '<rect x="62" y="48" width="176" height="105" rx="4" fill="#fff9fc" stroke="#886f82" stroke-width="3"/><path d="M64 52 150 115 236 52" fill="none" stroke="#886f82" stroke-width="3"/><path d="M150 122c-19-24-43 2 0 24 43-22 19-48 0-24" fill="#efafcb" stroke="#886f82" stroke-width="2"/>',
    '<path d="M112 74c-31-35-75 12-23 53l61 46 61-46c52-41 8-88-23-53l-38 38z" fill="#f1b4d0" stroke="#87677d" stroke-width="3"/><path d="M80 60h140" stroke="#fff" stroke-width="4"/>',
    '<rect x="78" y="37" width="144" height="139" rx="4" fill="#fbe2eb" stroke="#886f82" stroke-width="3"/><circle cx="118" cy="83" r="16" fill="#d2e8f1"/><path d="m92 150 38-41 25 24 21-32 32 49z" fill="#ebb4cb" stroke="#886f82" stroke-width="3"/>'
  ];
  const svg='<svg xmlns="http://www.w3.org/2000/svg" width="300" height="200" viewBox="0 0 300 200"><rect width="300" height="200" fill="#fff3f8"/><g fill="#d6a5bd" font-family="monospace" font-size="13"><text x="16" y="22">♡ NEW FILE ♡</text><text x="190" y="190">PREVIEW</text></g>'+drawings[index%drawings.length]+'</svg>';
  return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
}
function updateCounter(){const amount=windows.filter(w=>w.isConnected&&!w.classList.contains('closing')).length;counter.textContent=amount+' '+(amount===1?'NOTIFICAÇÃO':'NOTIFICAÇÕES');if(!running&&amount===0&&!disposed){title.textContent=CONFIG.tituloFinal;description.textContent=CONFIG.textoFinal;replay.hidden=false;toast.classList.add('hidden');}}
function closeWindow(win){if(!win||!win.isConnected||win.classList.contains('closing'))return;const audio=win.querySelector('audio');if(audio)audio.pause();win.classList.add('closing');setTimeout(()=>{win.remove();updateCounter()},180);}
function makeWindow(msg,index){
 const node=document.createElement('section');node.className='window';if(index===0)node.classList.add('final-window');node.style.setProperty('--tilt',rand(-3,3).toFixed(1)+'deg');node.style.zIndex=++highest;node.setAttribute('role','dialog');node.setAttribute('aria-label','Nova Mensagem');
 const image = msg.tipo==='imagem' ? '<img class="win-image" alt="'+escapeHtml(msg.alt||'Imagem da mensagem')+'" src="'+escapeHtml(msg.imagem||placeholder(index))+'">' : msg.tipo==='midia' ? '<button type="button" class="play-midia">▶ PLAY ♡</button><p class="media-status" aria-live="polite">Clique para ouvir ♫</p>' : '<div class="symbol" aria-hidden="true">'+(index%3===0?'♡':index%3===1?'✉':'✧')+'</div>';
 node.innerHTML='<div class="titlebar"><div class="win-title">Nova Mensagem</div><div class="controls"><button class="control" type="button" aria-label="Fechar janela">×</button></div></div><div class="win-body">'+image+'<p class="message">'+escapeHtml(msg.texto)+'</p><button class="action" type="button">'+escapeHtml(msg.botao||'OK')+'</button></div>';
 node.querySelectorAll('.control,.action').forEach(b=>b.addEventListener('click',()=>closeWindow(node)));
 const img=node.querySelector('.win-image');
 if(img) img.addEventListener('error',()=>{img.src=placeholder(index);img.onerror=null;},{once:true});
 if(msg.tipo==='midia'){
   let media;
   const play=node.querySelector('.play-midia');
   const status=node.querySelector('.media-status');
   play.addEventListener('click',async()=>{
     if(!media){media=document.createElement('audio');media.src=msg.arquivo;media.preload='auto';node.appendChild(media);media.addEventListener('ended',()=>{play.textContent='▶ PLAY ♡';status.textContent='Tocar novamente ♫'});}
     if(media.paused){try{await media.play();play.textContent='Ⅱ PAUSE';status.textContent='Tocando ♫'}catch(e){status.textContent='Não foi possível tocar. Verifique o arquivo '+msg.arquivo+' no GitHub.';}}
     else{media.pause();play.textContent='▶ PLAY ♡';status.textContent='Pausado ♫';}
   });
 }
 const vw=innerWidth,vh=innerHeight,w=Math.min(vw-28,vw<=600?320:390),h=msg.tipo==='imagem'?290:(msg.tipo==='midia'?220:(msg.texto.length>170?320:210));
 // A primeira janela é a mensagem final: fixa no centro e na camada mais funda.
 // As demais formam um amontoado central com dispersão radial imprevisível.
 const maxX=Math.max(0,vw-w), maxY=Math.max(0,vh-Math.min(h,vh*.58));
 const centerX=maxX/2, centerY=Math.max(vw<600?38:45,maxY/2);
 let x=centerX, y=centerY;
 if(index!==0){
   // Maioria bem no centro, algumas escapam mais para os lados.
   const spread=Math.random()<.78?rand(.08,.32):rand(.34,.62);
   const angle=rand(0,Math.PI*2);
   x=centerX+Math.cos(angle)*maxX*spread;
   y=centerY+Math.sin(angle)*maxY*spread;
   x=Math.max(0,Math.min(maxX,x));
   y=Math.max(vw<600?38:44,Math.min(maxY,y));
 }
 node.style.left=x+'px';node.style.top=y+'px';
 desktop.appendChild(node);windows.push(node);requestAnimationFrame(()=>node.classList.add('show'));updateCounter();
 // Permite arrastar pelo topo para descobrir janelas escondidas (mouse ou toque).
 const bar=node.querySelector('.titlebar');let active=false,startX=0,startY=0,left=0,top=0;
 bar.addEventListener('pointerdown',e=>{if(index===0||e.target.closest('button'))return;active=true;startX=e.clientX;startY=e.clientY;left=node.offsetLeft;top=node.offsetTop;node.style.zIndex=++highest;bar.setPointerCapture(e.pointerId)});
 bar.addEventListener('pointermove',e=>{if(!active)return;node.style.left=Math.min(Math.max(0,left+e.clientX-startX),Math.max(0,innerWidth-90))+'px';node.style.top=Math.min(Math.max(0,top+e.clientY-startY),Math.max(0,innerHeight-55))+'px'});
 bar.addEventListener('pointerup',()=>active=false);bar.addEventListener('pointercancel',()=>active=false);
}
function start(){timers.forEach(clearTimeout);windows.forEach(w=>w.remove());windows=[];running=true;disposed=false;replay.hidden=true;title.textContent='NOVAS MENSAGENS ♡';description.textContent='Recebendo novas mensagens…';toast.classList.remove('hidden');updateCounter();
 timers.push(setTimeout(()=>{
 // Rajadas: 2–5 janelas quase juntas, seguidas de pausas curtas e imprevisíveis.
 let delay=0, burstRemaining=0;
 MENSAGENS.forEach((msg,i)=>{
   if(burstRemaining<=0){
     burstRemaining=Math.floor(rand(2,6));
     delay+=i===0?0:rand(CONFIG.intervaloMs*.65,CONFIG.intervaloMs*2.9);
   } else if(i>0){delay+=rand(26,CONFIG.intervaloMs*.66)}
   burstRemaining--;
   timers.push(setTimeout(()=>{
     makeWindow(msg,i);
     if(i===MENSAGENS.length-1){
       running=false;updateCounter();
       toast.textContent='✧ Clique em OK ou × para fechar. Arraste as janelas pela barra rosa.';
       timers.push(setTimeout(()=>toast.classList.add('hidden'),4500));
     }
   },delay));
 });
 },CONFIG.atrasoInicialMs));
}
replay.addEventListener('click',start);
document.addEventListener('keydown',e=>{if(e.key==='Escape'){const top=windows.filter(w=>w.isConnected&&!w.classList.contains('closing')).sort((a,b)=>+b.style.zIndex-+a.style.zIndex)[0];if(top)closeWindow(top)}});
start();
</script>
</body>
</html>
